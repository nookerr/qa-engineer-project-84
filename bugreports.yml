---
- summary: |
    В карточках товаров в каталоге не отображается рейтинг товара
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://hexlet.app
  steps-to-reproduce: |
    1. Открыть главную страницу каталога интернет-магазина
    2. Осмотреть карточки товаров в списке каталога
  expected-result: |
    В карточке каждого товара в каталоге отображаются название, рейтинг, цена со скидкой и цена без скидки
  actual-result: |
    Рейтинг товара в карточках каталога отсутствует (отображается только на отдельной странице товара)

- summary: |
    Поиск и фильтрация товаров работают только в пределах текущей страницы пагинации
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://hexlet.app
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина (1-я страница каталога)
    2. Ввести в поиск название товара со 2-й страницы или выбрать фильтр по категории/производителю/цене/наличию
  expected-result: |
    Поиск и фильтрация применяются ко всем товарам каталога с учетом остальных страниц пагинации
  actual-result: |
    Фильтруются и ищутся только те товары, которые уже загружены на текущей открытой странице

- summary: |
    Поля фильтрации по цене принимают отрицательные значения
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://hexlet.app
  steps-to-reproduce: |
    1. Открыть главную страницу каталога интернет-магазина
    2. Ввести отрицательное число (например, -100) в поле минимальной или максимальной цены
  expected-result: |
    Поля фильтра по цене не позволяют вводить отрицательные числа (или сбрасывают значение на 0)
  actual-result: |
    Поля фильтра принимают отрицательные значения без валидации

- summary: |
    Некорректная область клика (рамка ссылки) у карточки товара в каталоге
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://hexlet.app
  steps-to-reproduce: |
    1. Открыть главную страницу каталога
    2. Навести курсор на карточку товара и инспектировать элемент через DevTools
  expected-result: |
    Кликабельная область карточки ровно соответствует ее визуальным границам
  actual-result: |
    Кликабельная область (рамка элемента) смещена относительно визуальной карточки товара

- summary: |
    Не работает переход в категорию при нажатии на хэштег на странице товара
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://hexlet.app
  steps-to-reproduce: |
    1. Открыть страницу любого товара из каталога
    2. Нажать на хэштег категории в описании товара
  expected-result: |
    Выполняется переход в каталог с примененным фильтром по выбранной категории
  actual-result: |
    При нажатии на хэштег переход в соответствующую категорию не происходит

- summary: |
    В корзине съезжает отображение количества товара при добавлении нескольких разных товаров
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://hexlet.app
  steps-to-reproduce: |
    1. Добавить первый товар из каталога в корзину
    2. Добавить второй (другой) товар из каталога в корзину
    3. Перейти на страницу корзины
  expected-result: |
    Позиции товаров в корзине выровнены ровно, значения количества товара отображаются корректно без смещения
  actual-result: |
    При добавлении нескольких разных товаров в корзине съезжает верстка блока с количеством товара

- summary: |
    Отсутствует переход на страницу оплаты после оформления заказа в корзине
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://hexlet.app
  steps-to-reproduce: |
    1. Добавить любой товар в корзину и перейти на страницу корзины
    2. Нажать кнопку оформления заказа, заполнить данные и подтвердить заказ
  expected-result: |
    После подтверждения заказа выполняется переход на страницу оплаты
  actual-result: |
    Переход на страницу оплаты не происходит, функционал оплаты отсутствует

- summary: |
    В меню выбора языка не отображается иконка флага (битая картинка) и выходит некорректное название языка English English (двойное название)
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://hexlet.app
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина
    2. Нажать на выпадающий список выбора языка (Language) в шапке сайта
  expected-result: |
    Напротив всех доступных языков в меню отображаются корректные иконки флагов
  actual-result: |
    Напротив пункта English иконка флага не загружается и отображается как сломанное изображение с alt-текстом English и также выходит двойное название языка

- summary: |
    При переключении на русский язык переводится только интерфейс, а названия и описания товаров остаются на английском
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://hexlet.app
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина
    2. В меню выбора языка в шапке сайта выбрать русский язык (Russian)
    3. Осмотреть карточки товаров в каталоге и страницу описания товара
  expected-result: |
    При выборе русского языка переводятся как элементы интерфейса, так и названия с описаниями товаров
  actual-result: |
    Системные кнопки и пункты меню переводятся корректно, но названия и описания товаров остаются на английском языке
