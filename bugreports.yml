---
- summary: |
    Поиск и фильтрация товаров работают только в пределах текущей страницы пагинации
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина и посмотреть название товара на 2-й странице каталога
    2. Вернуться на 1-ю страницу и ввести название этого товара в строку поиска (или применить фильтры)
  expected-result: |
    Поиск и фильтрация выполняются по всему ассортименту магазина с учетом всех страниц пагинации
  actual-result: |
    Товар со 2-й страницы не находится, поиск и фильтры работают только по текущей открытой странице

- summary: |
    Карточка товара в каталоге не является кликабельной целиком (ссылка не охватывает всю область карточки)
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. Открыть каталог товаров интернет-магазина
    2. Инспектировать карточку товара через DevTools и нажать на область описания внутри карточки
  expected-result: |
    Вся область карточки товара кликабельна и ведет на страницу подробного описания товара
  actual-result: |
    Элемент карточки не обернут в единую ссылку, при клике по области описания внутри карточки переход на страницу товара не происходит

- summary: |
    Отсутствует переход на страницу оплаты при оформлении заказа, а запрос api/orders возвращает ошибку 500
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. Открыть панель DevTools (вкладка Console), добавить товар в корзину и перейти в нее
    2. Нажать кнопку оформления заказа, заполнить форму и подтвердить заказ
  expected-result: |
    Запрос к серверу выполняется без ошибок и происходит редирект на страницу оплаты заказа
  actual-result: |
    Появляется только уведомление «Заказ оформлен» без перехода к оплате, а в консоли DevTools фиксируется ошибка сервера 500 на запрос api/orders

- summary: |
    При переключении на русский язык названия и описания товаров остаются на английском языке
  environment: |
    Google Chrome 130.0.6723.116 (64 бит), ОС Windows 11
    https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина
    2. Переключить язык интерфейса на русский (RU)
    3. Проверить карточки товаров в каталоге и на странице товара
  expected-result: |
    На русский язык переводятся как элементы интерфейса, так и названия с описаниями товаров
  actual-result: |
    Переводятся только системные кнопки и заголовки сайта, а названия и описания товаров остаются на английском языке
