---
- summary: |
    Не работает фильтрация товаров в каталоге по выбранной категории
  environment: |
    Google Chrome 130.0.6723.116 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина
    2. В блоке фильтров выбрать любую категорию товаров
    3. Нажать кнопку применения фильтра
  expected-result: |
    В каталоге отображаются только товары из выбранной категории без перезагрузки страницы
  actual-result: |
    Список товаров в каталоге не меняется, отображаются товары из всех категорий
    В консоли DevTools фиксируется ошибка выполнения скрипта

- summary: |
    Не пересчитывается итоговая стоимость заказа после удаления товара из корзины
  environment: |
    Google Chrome 130.0.6723.116 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина
    2. Добавить в корзину два разных товара из каталога
    3. Перейти на страницу корзины
    4. Нажать кнопку удаления напротив одного из добавленных товаров
  expected-result: |
    Товар удаляется из списка, а итоговая сумма заказа автоматически уменьшается на стоимость удаленного товара
  actual-result: |
    Товар исчезает из списка в корзине, но итоговая сумма заказа остается прежней

- summary: |
    Не переключается язык интерфейса на английский при выборе локали EN
  environment: |
    Google Chrome 130.0.6723.116 (Официальная сборка) (64 бит)
    ОС Windows 11
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина на русском языке
    2. Нажать на переключатель языка в шапке сайта и выбрать English (EN)
  expected-result: |
    Все элементы интерфейса, меню, кнопки и системные сообщения переводятся на английский язык
  actual-result: |
    Интерфейс остается на русском языке, перевод элементов не выполняется
