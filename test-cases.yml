---
- summary: |
    Успешный поиск товара по существующему ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта главная страница интернет-магазина с каталогом товаров
  test-data: |
    Поисковый запрос = Телефон
  steps:
    - Ввести тестовое значение в поле поиска
    - Нажать кнопку поиска или клавишу Enter
  expected-result: |
    В каталоге отображаются только товары, в названии или описании которых присутствует слово «Телефон», страница при этом не перезагружается

- summary: |
    Поиск товара по несуществующему ключевому слову
  requirement: |
    Отображение понятного сообщения при отсутствии товаров по заданным фильтрам или поисковому запросу
  prerequisites: |
    Открыта главная страница интернет-магазина с каталогом товаров
  test-data: |
    Поисковый запрос = Абракадабра12345
  steps:
    - Ввести тестовое значение в поле поиска
    - Нажать кнопку поиска или клавишу Enter
  expected-result: |
    Список товаров пуст, на экране отображается информационное сообщение о том, что по данному запросу ничего не найдено

- summary: |
    Фильтрация товаров в каталоге по выбранной категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница интернет-магазина с каталогом товаров
  test-data: |
    Категория = Электроника
  steps:
    - Выбрать категорию из списка фильтров
    - Применить фильтр
  expected-result: |
    В каталоге отображаются только товары из выбранной категории, перезагрузка страницы не происходит

- summary: |
    Просмотр подробной информации на странице товара
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites: |
    Открыт каталог товаров интернет-магазина
  test-data: |
    Любой товар из каталога
  steps:
    - Нажать на карточку выбранного товара в каталоге
  expected-result: |
    Открывается страница товара с отображением названия, изображения, подробного описания, рейтинга, цены со скидкой, цены без скидки и кнопки добавления в корзину

- summary: |
    Успешное добавление товара в корзину из каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыт каталог товаров интернет-магазина, корзина пуста
  test-data: |
    Любой доступный товар из каталога
  steps:
    - Нажать кнопку добавления в корзину на карточке товара
    - Перейти на страницу корзины
  expected-result: |
    Выбранный товар отображается в корзине с корректным названием, ценой и количеством, равным 1

- summary: |
    Удаление товара из корзины и автоматический пересчет общей стоимости
  requirement: |
    При добавлении или удалении товара из корзины общая стоимость заказа должна автоматически пересчитываться
  prerequisites: |
    В корзину добавлено два разных товара, открыта страница корзины
  test-data: |
    Не требуются
  steps:
    - Нажать кнопку удаления напротив одного из товаров в корзине
  expected-result: |
    Выбранный товар удаляется из списка в корзине, а итоговая стоимость заказа автоматически уменьшается на цену удаленного товара

- summary: |
    Переключение языка интерфейса с русского на английский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Открыта главная страница интернет-магазина на русском языке
  test-data: |
    Язык интерфейса = English (EN)
  steps:
    - Нажать на переключатель языка в шапке сайта
    - Выбрать английский язык
  expected-result: |
    Все элементы интерфейса, пункты меню, кнопки и системные сообщения переводятся на английский язык

- summary: |
    Переход из корзины на страницу оформления заказа и оплаты
  requirement: |
    Пользователь должен иметь возможность удалять товары из корзины и переходить к оформлению заказа
  prerequisites: |
    В корзину добавлен хотя бы один товар, открыта страница корзины
  test-data: |
    Не требуются
  steps:
    - Нажать кнопку оформления заказа
  expected-result: |
    Открывается страница оформления заказа с формой ввода данных покупателя и переходом к оплате
