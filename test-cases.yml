---
- summary: |
    Проверка отображения основных элементов карточки товара в каталоге
  requirement: |
    В каталоге и на странице товара отображаются название, рейтинг, цена со скидкой и цена без скидки
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Первая карточка товара в каталоге
  steps:
    - Открыть каталог товаров
    - Осмотреть содержимое карточки товара
  expected-result: |
    В карточке товара отображаются изображение, название, рейтинг, цена со скидкой и цена без скидки

- summary: |
    Успешный поиск товара по ключевому слову по всему каталогу
  requirement: |
    Пользователь может искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Название товара со второй страницы каталога
  steps:
    - Ввести название товара в поле поиска
    - Нажать клавишу Enter
  expected-result: |
    В каталоге отображается искомый товар, даже если до поиска он находился на другой странице пагинации

- summary: |
    Поиск товара по несуществующему ключевому слову
  requirement: |
    При отсутствии товаров по выбранным фильтрам или поиску выводится понятное информационное сообщение
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Поисковый запрос = несуществующийтовар999
  steps:
    - Ввести тестовый запрос в поле поиска
    - Нажать клавишу Enter
  expected-result: |
    Карточки товаров скрываются, на экране отображается информационное сообщение о том, что товары не найдены

- summary: |
    Успешная фильтрация товаров по категории
  requirement: |
    Пользователь может фильтровать товары по категории, производителю, цене и наличию
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Любая категория из выпадающего списка
  steps:
    - Открыть список категорий в блоке фильтров
    - Выбрать нужную категорию
  expected-result: |
    В каталоге отображаются только товары выбранной категории из всего ассортимента магазина

- summary: |
    Успешная фильтрация товаров по производителю
  requirement: |
    Пользователь может фильтровать товары по категории, производителю, цене и наличию
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Любой производитель из списка фильтров
  steps:
    - Открыть список производителей в блоке фильтров
    - Выбрать одного производителя
  expected-result: |
    В каталоге отображаются только товары выбранного производителя из всего ассортимента магазина

- summary: |
    Успешная фильтрация товаров по диапазону цен
  requirement: |
    Пользователь может фильтровать товары по категории, производителю, цене и наличию
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Минимальная цена = 1000, максимальная цена = 5000
  steps:
    - Ввести 1000 в поле минимальной цены
    - Ввести 5000 в поле максимальной цены
  expected-result: |
    В каталоге отображаются только товары, цена которых находится в диапазоне от 1000 до 5000

- summary: |
    Валидация отрицательных значений в полях фильтрации по цене
  requirement: |
    Пользователь может фильтровать товары по категории, производителю, цене и наличию
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Минимальная цена = -100
  steps:
    - Ввести отрицательное значение -100 в поле минимальной цены
  expected-result: |
    Поле фильтра не принимает отрицательные числа (символ минуса блокируется или значение сбрасывается на 0)


- summary: |
    Успешная фильтрация товаров по наличию
  requirement: |
    Пользователь может фильтровать товары по категории, производителю, цене и наличию
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Фильтр «В наличии»
  steps:
    - Активировать фильтр отображения товаров только в наличии
  expected-result: |
    Из каталога скрываются товары, отсутствующие в наличии

- summary: |
    Успешный переход между страницами каталога (пагинация)
  requirement: |
    Пользователь может просматривать каталог товаров с постраничным выводом (пагинацией)
  prerequisites: |
    Открыта первая страница каталога товаров
  test-data: |
    Номер страницы = 2
  steps:
    - Пролистать страницу до блока пагинации
    - Нажать на номер второй страницы
  expected-result: |
    Список товаров обновляется без перезагрузки страницы, отображаются товары второй страницы, активным становится индикатор страницы 2

- summary: |
    Успешный переход на страницу товара и проверка области клика карточки
  requirement: |
    Вся область карточки товара в каталоге является кликабельной и совпадает с ее визуальными границами
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Любой товар из каталога
  steps:
    - Навести курсор на карточку товара и проверить границы ссылки в DevTools
    - Нажать на область описания внутри карточки товара
  expected-result: |
    Вся область карточки обернута в единую ссылку, клик по любой части карточки открывает страницу товара с описанием, рейтингом, ценой со скидкой и без, а также кнопкой добавления в корзину

- summary: |
    Успешный переход в категорию по хэштегу со страницы товара
  requirement: |
    Пользователь может перейти в категорию по хэштегу со страницы товара
  prerequisites: |
    Открыта страница любого товара
  test-data: |
    Хэштег категории на странице товара
  steps:
    - Нажать на хэштег категории
  expected-result: |
    Открывается каталог с примененным фильтром по выбранной категории

- summary: |
    Успешное добавление нескольких одинаковых товаров в корзину
  requirement: |
    Пользователь может добавлять товары в корзину и продолжать выбирать товары в каталоге
  prerequisites: |
    Корзина пуста, открыт каталог товаров
  test-data: |
    Один любой товар из каталога
  steps:
    - Нажать кнопку добавления в корзину у выбранного товара
    - Повторно нажать кнопку добавления в корзину у этого же товара
    - Перейти в корзину
  expected-result: |
    В корзине отображается одна позиция товара с количеством 2 шт., итоговая сумма равна удвоенной цене товара

- summary: |
    Успешное добавление нескольких разных товаров в корзину
  requirement: |
    Пользователь может добавлять товары в корзину и продолжать выбирать товары в каталоге
  prerequisites: |
    Корзина пуста, открыт каталог товаров
  test-data: |
    Два разных товара из каталога
  steps:
    - Добавить первый товар в корзину
    - Продолжить просмотр каталога и добавить второй товар в корзину
    - Перейти в корзину
  expected-result: |
    В корзине отображаются обе позиции товаров, итоговая стоимость заказа равна сумме их цен

- summary: |
    Успешное удаление одного товара из корзины с пересчетом суммы
  requirement: |
    При добавлении, изменении количества или удалении товара общая сумма в корзине пересчитывается автоматически
  prerequisites: |
    В корзину добавлено два разных товара, открыта страница корзины
  test-data: |
    Два товара в корзине
  steps:
    - Нажать кнопку удаления рядом с первым товаром
  expected-result: |
    Первый товар удаляется из списка в корзине, а итоговая стоимость заказа уменьшается на его цену

- summary: |
    Успешная полная очистка корзины
  requirement: |
    На странице корзины пользователь может удалять товары, очищать корзину и вернуться к покупкам
  prerequisites: |
    В корзину добавлено два товара, открыта страница корзины
  test-data: |
    Товары в корзине
  steps:
    - Нажать кнопку очистки корзины
  expected-result: |
    Все товары удаляются из списка, счетчик корзины в шапке обнуляется, выводится сообщение о том, что корзина пуста

- summary: |
    Успешный возврат в каталог товаров со страницы корзины
  requirement: |
    На странице корзины пользователь может удалять товары, очищать корзину и вернуться к покупкам
  prerequisites: |
    В корзину добавлен один товар, открыта страница корзины
  test-data: |
    Добавленный в корзину товар
  steps:
    - Нажать кнопку продолжения покупок в корзине
  expected-result: |
    Пользователь возвращается на страницу каталога товаров, ранее добавленный товар сохраняется в корзине

- summary: |
    Успешное оформление заказа с переходом на страницу оплаты
  requirement: |
    Пользователь может оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзину добавлен хотя бы один товар, открыта страница корзины
  test-data: |
    Корректные контактные данные покупателя
  steps:
    - Нажать кнопку оформления заказа
    - Заполнить поля формы и подтвердить заказ
  expected-result: |
    После подтверждения заказа выполняется редирект на страницу оплаты

- summary: |
    Успешное закрытие окна оформления заказа без потери товаров
  requirement: |
    На странице корзины пользователь может удалять товары, очищать корзину и вернуться к покупкам
  prerequisites: |
    Открыта страница корзины с товаром, открыто окно оформления заказа
  test-data: |
    Окно оформления заказа
  steps:
    - Нажать кнопку закрытия окна заказа
  expected-result: |
    Окно оформления заказа закрывается, пользователь остается на странице корзины, добавленные товары сохраняются

- summary: |
    Корректное отображение интерфейса при переключении на русский язык
  requirement: |
    Пользователь может переключить язык интерфейса между русским и английским
  prerequisites: |
    Открыт сайт интернет-магазина на английском языке
  test-data: |
    Язык интерфейса = Русский (RU)
  steps:
    - Выбрать русский язык в переключателе в шапке сайта
    - Проверить перевод элементов в каталоге и блоке фильтров
    - Перейти на страницу товара и в корзину, проверить перевод кнопок, заголовков и карточек товаров
  expected-result: |
    На русский язык переводятся все элементы интерфейса, а также названия и описания товаров

- summary: |
    Корректное отображение интерфейса при переключении на английский язык
  requirement: |
    Пользователь может переключить язык интерфейса между русским и английским
  prerequisites: |
    Открыт сайт интернет-магазина на русском языке
  test-data: |
    Язык интерфейса = English (EN)
  steps:
    - Выбрать английский язык в переключателе в шапке сайта
    - Проверить перевод элементов в каталоге и блоке фильтров
    - Перейти на страницу товара и в корзину, проверить перевод кнопок, заголовков и карточек товаров
  expected-result: |
    Все разделы сайта (каталог, фильтры, страница товара, корзина) отображаются на английском языке без остатков русского текста

- summary: |
    Отсутствие ошибок в сетевых запросах и консоли DevTools при работе с магазином
  requirement: |
    Сетевые запросы к серверу выполняются без ошибок 4xx и 5xx, в консоли браузера отсутствуют ошибки выполнения скриптов
  prerequisites: |
    Открыт браузер с панелью DevTools (вкладки Console и Network)
  test-data: |
    Переходы по каталогу, фильтрация, открытие карточки товара и оформление заказа
  steps:
    - Открыть главную страницу магазина, выполнить переход в товар, добавить его в корзину и оформить заказ
    - Проверить статусы HTTP-запросов во вкладке Network и сообщения во вкладке Console
  expected-result: |
    Все сетевые запросы завершаются без кодов ошибок 4xx и 5xx, в консоли браузера отсутствуют ошибки выполнения скриптов

- summary: |
    Корректная работа интернет-магазина в разных браузерах (Chrome и Firefox)
  requirement: |
    Сайт корректно работает в последних версиях популярных браузеров
  prerequisites: |
    Установлены актуальные версии браузеров Google Chrome и Mozilla Firefox
  test-data: |
    Браузеры Google Chrome и Mozilla Firefox
  steps:
    - Открыть интернет-магазин в Google Chrome и пройти сценарий добавления товара в корзину
    - Открыть интернет-магазин в Mozilla Firefox и пройти сценарий добавления товара в корзину
  expected-result: |
    Интерфейс отображается корректно в обоих браузерах, товары добавляются в корзину без ошибок

- summary: |
    Корректное отображение верстки на мобильном устройстве (ширина 375px)
  requirement: |
    Сайт имеет адаптивную верстку и корректно отображается на мобильных устройствах
  prerequisites: |
    Открыт сайт магазина в режиме эмуляции мобильного экрана (ширина 375px)
  test-data: |
    Разрешение экрана = 375x667
  steps:
    - Проверить отображение шапки, каталога товаров и фильтров на ширине 375px
    - Открыть страницу товара и страницу корзины на ширине 375px
  expected-result: |
    Отсутствует горизонтальная прокрутка страницы, элементы не наезжают друг на друга, все кнопки доступны для нажатия

- summary: |
    Проверка отображения и работы основных разделов сайта на мобильном экране (ширина 375px)
  requirement: |
    Сайт имеет адаптивную верстку и корректно отображается на мобильных устройствах
  prerequisites: |
    Открыт сайт интернет-магазина в режиме эмуляции мобильного экрана (ширина 375px)
  test-data: |
    Разрешение экрана = 375x667
  steps:
    - Открыть главную страницу с каталогом товаров на ширине экрана 375px
    - Открыть панель фильтров и применить фильтрацию товаров
    - Открыть страницу выбранного товара
    - Нажать кнопку добавления товара в корзину
    - Перейти на страницу корзины
    - Нажать кнопку оформления заказа и заполнить форму заказа
  expected-result: |
    Все основные разделы сайта (каталог, фильтры, карточка товара, корзина и форма заказа) корректно адаптируются под ширину 375px без горизонтальной прокрутки и наложения элементов
